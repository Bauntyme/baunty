<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Kinolar katalogi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="music.css">
<link rel="stylesheet" href="docs.css">
<link rel="stylesheet" href="games.css">
<link rel="stylesheet" href="story.css">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://lh3.googleusercontent.com">
<style>
:root{
  --bg:var(--tg-theme-bg-color,#0e0f13);
  --bg2:var(--tg-theme-secondary-bg-color,#17181e);
  --card:var(--tg-theme-section-bg-color,var(--bg2));
  --text:var(--tg-theme-text-color,#f2f3f5);
  --hint:var(--tg-theme-hint-color,#8b8e98);
  --accent:var(--tg-theme-button-color,#e5484d);
  --accent-text:var(--tg-theme-button-text-color,#fff);
  --link:var(--tg-theme-link-color,var(--accent));
  --sep:color-mix(in srgb,var(--hint) 22%,transparent);
  --shade:color-mix(in srgb,var(--text) 7%,transparent);
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block}

/* ---------- sarlavha ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 16px 8px;
  box-shadow:0 1px 0 var(--sep)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand h1{font-size:21px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.3px}
.brand small{display:block;color:var(--hint);font-size:13px;font-weight:500;margin-top:2px}
.chan[hidden],.chips[hidden]{display:none}
.chan{flex:none;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;
  background:var(--shade);font-size:13px;font-weight:600;color:var(--link)}
.search{position:relative;display:block}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.search input{width:100%;height:42px;border:0;border-radius:12px;background:var(--bg2);color:var(--text);
  padding:0 40px 0 40px;font-size:16px;outline:none}
.search input::placeholder{color:var(--hint)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--hint);pointer-events:none}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;
  color:var(--hint);font-size:18px;display:none}
.search.has .clr{display:block}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scroll-padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--bg2);font-size:14px;font-weight:600;
  color:var(--text);transition:background .15s,color .15s}
.chip.on{background:var(--accent);color:var(--accent-text)}

/* ---------- bo'limlar ---------- */
main{padding:6px 16px calc(28px + env(safe-area-inset-bottom))}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 10px}
.sec-h h2{font-size:17px;margin:0;font-weight:750}
.sec-h span{color:var(--hint);font-size:13px}
.row{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory;
  scroll-padding-inline:16px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row .card{width:132px;flex:none;scroll-snap-align:start}
.pst{width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:14px 10px;align-items:start}

/* ---------- kartochka ---------- */
.card{display:flex;flex-direction:column;justify-content:flex-start;align-self:start;text-align:left;min-width:0;width:100%}
.pst{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:var(--bg2)}
.pst img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.pst img.ok{opacity:1}
.card:active .pst{transform:scale(.97)}
.pst{transition:transform .12s}
.ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:10px 10px 34px;font-weight:700;font-size:13px;
  line-height:1.25;color:#fff;word-break:break-word}
.ph::before{content:"🎬";position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);font-size:30px;opacity:.55}
.badge,.parts,.seen{position:absolute;font-size:11px;font-weight:700;line-height:1;padding:4px 6px;border-radius:6px;
  background:rgba(0,0,0,.62);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.badge{top:6px;left:6px}
.parts{bottom:6px;left:6px}
.seen{top:6px;right:6px;background:rgba(46,160,67,.9)}
.rank{position:absolute;bottom:-6px;right:4px;font-size:44px;font-weight:900;line-height:1;color:#fff;
  -webkit-text-stroke:2px rgba(0,0,0,.55);text-shadow:0 2px 10px rgba(0,0,0,.5)}
.ttl{margin-top:6px;font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}

.sk .pst{background:linear-gradient(100deg,var(--bg2) 30%,var(--shade) 50%,var(--bg2) 70%);
  background-size:300% 100%;animation:sh 1.2s infinite linear}
.sk .ttl{height:12px;width:80%;border-radius:6px;background:var(--bg2)}
@keyframes sh{to{background-position:-150% 0}}

.empty{text-align:center;color:var(--hint);padding:48px 20px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.empty .big{font-size:44px;margin-bottom:8px}

/* ---------- batafsil ---------- */
.det{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;transform:translateY(100%);
  transition:transform .28s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.det.open{transform:none}
.hero{position:relative;padding:20px 16px 0;display:flex;justify-content:center;overflow:hidden}
.hero .blur{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(36px) saturate(1.3);
  opacity:.55;transform:scale(1.2)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 35%,var(--bg))}
.hero .pst{position:relative;z-index:1;width:min(58vw,250px);flex:none;box-shadow:0 16px 40px rgba(0,0,0,.45)}
.close{position:fixed;top:12px;right:12px;z-index:3;width:34px;height:34px;border-radius:50%;
  background:rgba(0,0,0,.45);color:#fff;font-size:18px;display:none}
.no-tg .close{display:block}
.info{padding:16px 16px calc(110px + env(safe-area-inset-bottom))}
.info h2{margin:0 0 10px;font-size:22px;line-height:1.2;font-weight:800;text-align:center}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:16px}
.meta span{padding:6px 10px;border-radius:999px;background:var(--bg2);font-size:13px;font-weight:600}
.desc{white-space:pre-line;color:var(--text);opacity:.88;font-size:14.5px;line-height:1.5;margin:0 0 18px;
  overflow-wrap:anywhere}
.desc.cut{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.more{color:var(--link);font-weight:600;font-size:14px;margin:-10px 0 18px}
.ph-h{font-size:16px;font-weight:750;margin:4px 0 10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.pbtn{height:44px;border-radius:10px;background:var(--bg2);font-weight:700;font-size:15px;position:relative}
.pbtn.seen{background:color-mix(in srgb,var(--accent) 22%,var(--bg2))}
.pbtn.busy{opacity:.5}
.play{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));height:52px;border-radius:14px;
  background:var(--accent);color:var(--accent-text);font-size:17px;font-weight:800;display:none;z-index:2;
  box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent)}
.no-tg .det.open .play{display:block}

/* ---------- obuna oynasi va toast ---------- */
.sheet-bg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;background:var(--bg);border-radius:18px 18px 0 0;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s}
.sheet.open{transform:none}
.sheet h3{margin:0 0 6px;font-size:18px}
.sheet p{margin:0 0 14px;color:var(--hint);font-size:14px}
.sbtn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 14px;border-radius:12px;
  background:var(--bg2);margin-bottom:8px;font-weight:650;text-align:left}
.sbtn span:last-child{color:var(--link);font-size:14px}
.cta{width:100%;height:48px;border-radius:12px;background:var(--accent);color:var(--accent-text);font-weight:800;
  font-size:16px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));z-index:90;transform:translate(-50%,20px);
  background:rgba(20,20,24,.94);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- rejim tanlash: Kinolar | TV ---------- */
.seg{display:inline-flex;background:var(--bg2);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:9px;font-weight:750;font-size:15px;color:var(--hint);transition:.15s;white-space:nowrap}
@media (max-width:374px){.seg button{padding:7px 9px;font-size:14px}.chan{padding:7px 9px;font-size:12px}}
.brand>div:first-child{min-width:0;max-width:100%;overflow-x:auto;scrollbar-width:none}
.brand>div:first-child::-webkit-scrollbar{display:none}
body.seg4 .chan{display:none}
body.seg4 .seg button{padding:7px 10px;font-size:14px}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.brand small{margin-top:6px}
#chips2{margin-top:8px}
.chip.s{padding:6px 12px;font-size:13px}

/* ---------- 📺 TV ---------- */
.tvsoon .search{display:none}
.soon{text-align:center;padding:56px 24px 40px;max-width:360px;margin:0 auto}
.soon-tv{position:relative;width:132px;height:100px;margin:0 auto 22px;border-radius:22px;background:var(--bg2);display:flex;align-items:center;justify-content:center}
.soon-tv i{font-style:normal;font-size:52px;position:relative}
.soon-tv span{position:absolute;inset:-8px;border-radius:28px;border:2px solid var(--accent);opacity:0;animation:soonp 2.4s ease-out infinite}
@keyframes soonp{0%{opacity:.7;transform:scale(.9)}100%{opacity:0;transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){.soon-tv span{animation:none;opacity:.4}}
.soon h2{font-size:22px;font-weight:800;margin:0 0 10px}
.soon p{color:var(--hint);font-size:15px;line-height:1.5;margin:0 0 24px}
.soon .cta{max-width:240px;margin:0 auto}
.tvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px 10px}
.tv{display:flex;flex-direction:column;min-width:0;text-align:left}
.tvb{position:relative;aspect-ratio:16/11;border-radius:var(--r);background:#fff;overflow:hidden;display:flex;
  align-items:center;justify-content:center;padding:12px;transition:transform .12s;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.tv:active .tvb{transform:scale(.96)}
.tvb img,.tvbar .lg img{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);object-fit:contain;
  opacity:0;transition:opacity .2s;background:#fff}
.tvbar .lg{position:relative}
.tvbar .lg img{inset:3px;width:calc(100% - 6px);height:calc(100% - 6px)}
.tvb img.ok,.tvbar .lg img.ok{opacity:1}
.tvi{width:100%;height:100%;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;font-size:22px;letter-spacing:-.5px}
.live{position:absolute;top:6px;left:6px;font-size:9px;font-weight:800;letter-spacing:.5px;color:#fff;background:#e5484d;
  padding:3px 5px;border-radius:5px;line-height:1}
.fav{position:absolute;top:5px;right:6px;font-size:13px}
.tv-res{position:absolute;bottom:6px;right:6px;font-size:9px;font-weight:800;letter-spacing:.3px;color:#000;
  background:linear-gradient(135deg,#FFD700,#FFA500);padding:2px 5px;border-radius:4px;line-height:1}
.badge-res{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;font-weight:900;font-size:11px;
  padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:middle;display:inline-block}
.tvn{margin-top:6px;font-size:13px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tv{width:118px;flex:none;scroll-snap-align:start}

.tvp{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;transform:translateY(100%);
  transition:transform .26s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.tvp.open{transform:none}
.vbox{position:sticky;top:0;z-index:2;background:#000;aspect-ratio:16/9;width:100%}
.vbox video,.vbox iframe{width:100%;height:100%;display:block;background:#000;border:0}
.vbox iframe[hidden],.vbox video[hidden]{display:none}
.badb{display:block;margin:10px 16px 0;width:calc(100% - 32px);padding:10px;border-radius:12px;background:var(--bg2);
  color:var(--hint);font-size:13px;font-weight:650}
.vov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  color:#fff;text-align:center;padding:16px;background:rgba(0,0,0,.55);font-size:15px}
.vov[hidden]{display:none}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.vbtn{padding:10px 18px;border-radius:999px;background:#fff;color:#000;font-weight:800;font-size:14px}
.unmute{position:absolute;right:10px;bottom:10px;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;
  font-weight:700;font-size:13px}
.tvbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--sep)}
.tvbar .lg{width:48px;height:36px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;
  padding:4px;flex:none;overflow:hidden}
.tvbar .lg .tvi{font-size:14px}
.tvbar b{display:block;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvbar small{color:#e5484d;font-weight:800;font-size:12px;letter-spacing:.3px}
.tvbar .grow{flex:1;min-width:0}
.ib{width:40px;height:40px;border-radius:50%;background:var(--bg2);font-size:18px;flex:none}
.tvmore{padding:6px 16px calc(24px + env(safe-area-inset-bottom))}
.tv.cur .tvb{box-shadow:0 0 0 3px var(--accent)}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div><div class="seg" id="seg"><button class="on" data-m="kino">🎬 Kinolar</button><button data-m="music">🎧 Musiqa</button><button data-m="games">🧸 O'yinlar</button><button data-m="story">👻 Story</button><button data-m="docs">📄 Hujjatlar</button><button data-m="tv">📺 TV</button></div>
      <small id="count">Yuklanmoqda…</small></div>
    <button class="chan" id="chan" hidden>📢 Kanal</button>
  </div>
  <label class="search" id="sbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" inputmode="search" autocomplete="off" enterkeyhint="search" placeholder="Kino nomi yoki kodi…">
    <button class="clr" id="clr" type="button" aria-label="Tozalash">✕</button>
  </label>
  <nav class="chips" id="chips">
    <button class="chip on" data-t="all">Hammasi</button>
    <button class="chip" data-t="pop">🔥 Ommabop</button>
    <button class="chip" data-t="film">🎬 Filmlar</button>
    <button class="chip" data-t="ser">📺 Seriallar</button>
    <button class="chip" data-t="seen">✓ Ko'rganlarim</button>
  </nav>
  <nav class="chips" id="chips2" hidden></nav>
</header>
<main id="main"></main>

<section class="det" id="det" aria-modal="true">
  <button class="close" id="dclose">✕</button>
  <div class="hero" id="hero"></div>
  <div class="info" id="info"></div>
  <button class="play" id="play">▶️ Tomosha qilish</button>
</section>

<section class="tvp" id="tvp" aria-modal="true">
  <div class="vbox" id="vbox">
    <video id="vid" playsinline webkit-playsinline preload="none"></video>
    <iframe id="yt" hidden allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="origin"></iframe>
    <div class="vov" id="vload"><div class="spin"></div><span id="vmsg">Efirga ulanmoqda…</span></div>
    <div class="vov" id="verr" hidden><div style="font-size:40px">📡</div><b id="verrt">Bu kanal hozir efirda emas</b>
      <span style="opacity:.8;font-size:13px">Keyinroq urinib ko'ring yoki boshqa kanalni tanlang</span>
      <div style="display:flex;gap:8px"><button class="vbtn" id="vretry">🔄 Qayta</button><button class="vbtn" id="vnext">Keyingi ›</button></div></div>
    <button class="unmute" id="unmute" hidden>🔇 Ovozni yoqish</button>
  </div>
  <div class="tvbar"><div class="lg" id="tvlogo"></div><div class="grow"><b id="tvname"></b><small>● JONLI EFIR</small></div>
    <button class="ib" id="tvfav" aria-label="Sevimli">☆</button><button class="ib" id="tvfs" aria-label="To'liq ekran">⛶</button>
    <button class="ib" id="tvdel" aria-label="Kanalni o'chirish" hidden>🗑</button>
    <button class="ib" id="tvx" aria-label="Yopish" style="display:none">✕</button></div>
  <button class="badb" id="tvbad">⚠️ Ishlamayapti yoki reklama chiqyapti — boshqa efirni sinash</button>
  <div class="tvmore"><div class="sec-h"><h2>📺 Boshqa kanallar</h2></div><div class="tvgrid" id="tvlist"></div></div>
</section>



<!-- ================= 🎧 MUSIQA ================= -->
<section class="mus nomini" id="mus" hidden>
  <div class="m-scroll" id="mscroll"><div id="mview"></div></div>
  <button class="m-fab" id="mfab" aria-label="Qo'shiqni aniqlash"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3" fill="#fff"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg></button>
</section>
<div class="m-mini" id="mmini" hidden role="button" aria-label="Pleyerni ochish">
  <div class="m-cv" id="mmcv"></div>
  <div class="t"><b id="mmt"></b><small id="mma"></small></div>
  <button class="c" id="mmplay" aria-label="Ijro / pauza"></button>
  <button class="c" id="mmnext" aria-label="Keyingisi"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 6.2v11.6a1 1 0 0 0 1.55.83l8.7-5.8a1 1 0 0 0 0-1.66l-8.7-5.8A1 1 0 0 0 5 6.2z"/><rect x="16.6" y="5" width="2.6" height="14" rx="1.2"/></svg></button>
  <div class="pr"><i id="mmpr"></i></div>
</div>
<section class="m-player" id="mplayer" aria-modal="true">
  <div class="bgc" id="mbgc"></div>
  <div class="m-ptop">
    <button class="m-ib" id="mpdown" aria-label="Yopish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <span id="mpsrc">Hozir ijroda</span>
    <button class="m-ib" id="mpmore" aria-label="Amallar"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <div class="m-pbody">
    <div class="m-cv m-big" id="mbig"></div>
    <div class="m-pinfo"><div class="t"><h1 class="m-h" id="mpt"></h1><button class="ar" id="mpa"></button></div>

<script>
(() => {
"use strict";
const tg = window.Telegram && Telegram.WebApp;
const inTg = !!(tg && tg.initData);
if (!inTg) document.body.classList.add("no-tg");
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor("bg_color"); tg.setBackgroundColor("bg_color"); } catch (e) {}
  try { if (tg.isVersionAtLeast("7.7")) tg.disableVerticalSwipes(); } catch (e) {}
}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const haptic = (t) => { try { t === "ok" ? tg.HapticFeedback.notificationOccurred("success")
  : t === "err" ? tg.HapticFeedback.notificationOccurred("error") : tg.HapticFeedback.selectionChanged(); } catch (e) {} };
const fmt = (n) => n >= 1e6 ? (n/1e6).toFixed(1).replace(".0","") + "M" : n >= 1e3 ? (n/1e3).toFixed(1).replace(".0","") + "K" : String(n);

// ---------- ko'rilganlar (shu qurilmada) ----------
const SEEN_KEY = "zk_seen_v1";
let seen = {};
try { seen = JSON.parse(localStorage.getItem(SEEN_KEY) || "{}") || {}; } catch (e) { seen = {}; }
const markSeen = (c, p) => { (seen[c] = seen[c] || []).includes(p) || seen[c].push(p);
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) {} };

// ---------- qidiruv: kirill → lotin, apostroflar ----------
const CYR = {"а":"a","б":"b","в":"v","г":"g","ғ":"g","д":"d","е":"e","ё":"yo","ж":"j","з":"z","и":"i","й":"y","к":"k",
  "қ":"q","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ў":"o","ф":"f","х":"x","ҳ":"h",
  "ц":"ts","ч":"ch","ш":"sh","щ":"sh","ъ":"","ы":"i","ь":"","э":"e","ю":"yu","я":"ya"};
const norm = (s) => String(s || "").toLowerCase().replace(/[а-яёғқўҳ]/g, (ch) => CYR[ch] ?? ch)
  .replace(/[ʻʼ'`’‘´]/g, "").replace(/[^\p{L}\p{N}]+/gu, " ").trim();

let items = [], byCode = new Map(), tab = "all", query = "", channel = "", botName = "";

const posterHTML = (it, size, extra = "") => {
  const img = it.i ? `<img src="p/${it.c}_${size}.webp?v=${it.i}" alt="" decoding="async" ${size === "s" ? 'loading="lazy"' : ""}>` : "";
  const hue = (it.c * 47) % 360;
  return `<div class="pst"${it.i ? "" : ` style="background:linear-gradient(160deg,hsl(${hue} 45% 32%),hsl(${(hue+40)%360} 50% 14%))"`}>
    ${img || `<div class="ph">${esc(it.t)}</div>`}${extra}</div>`;
};
const cardHTML = (it, rank) => `<button class="card" data-c="${it.c}">${posterHTML(it, "s",
  `<span class="badge">#${it.c}</span>${it.p > 1 ? `<span class="parts">${it.p} qism</span>` : ""}` +
  (seen[it.c] ? `<span class="seen">✓</span>` : "") + (rank ? `<span class="rank">${rank}</span>` : ""))}
  <div class="ttl">${esc(it.t)}</div></button>`;

function skeleton() {
  $("main").innerHTML = `<div class="sec-h"><h2>&nbsp;</h2></div><div class="grid">` +
    Array.from({length: 12}, () => `<div class="card sk"><div class="pst"></div><div class="ttl"></div></div>`).join("") + "</div>";
}

function render() {
  const m = $("main");
  let list = items;
  if (tab === "film") list = list.filter((x) => x.p <= 1);
  else if (tab === "ser") list = list.filter((x) => x.p > 1);
  else if (tab === "seen") list = list.filter((x) => seen[x.c]);
  if (tab === "pop") list = [...list].sort((a, b) => b.v - a.v);

  if (query) {
    const q = norm(query), digits = query.replace(/\D/g, "");
    const words = q.split(" ").filter(Boolean);
    const exact = digits && /^\d+$/.test(query.trim()) ? byCode.get(+digits) : null;
    list = list.filter((x) => x !== exact && (x._k.includes(q) || words.every((w) => x._k.includes(w)) ||
      (digits && String(x.c).startsWith(digits))));
    list.sort((a, b) => (b._n.startsWith(q) - a._n.startsWith(q)) || (b.v - a.v));
    if (exact) list.unshift(exact);
    m.innerHTML = list.length
      ? `<div class="sec-h"><h2>Natijalar</h2><span>${list.length} ta</span></div><div class="grid">${list.map((x) => cardHTML(x)).join("")}</div>`
      : `<div class="empty"><div class="big">🔍</div><b>Hech narsa topilmadi</b>Boshqa nom bilan qidirib ko'ring yoki kino kodini botga yuboring.</div>`;
    return;
  }
  if (!list.length) {
    m.innerHTML = tab === "seen"
      ? `<div class="empty"><div class="big">🍿</div><b>Hali hech narsa ko'rmadingiz</b>Kino tanlang — u shu yerda belgilanib boradi.</div>`
      : `<div class="empty"><div class="big">🎬</div><b>Hozircha bo'sh</b></div>`;
    return;
  }
  let html = "";
  if (tab === "all") {
    const top = [...items].filter((x) => x.v > 0).sort((a, b) => b.v - a.v).slice(0, 10);
    if (top.length >= 3) html += `<div class="sec-h"><h2>🔥 Top ${top.length}</h2><span>eng ko'p ko'rilgan</span></div>
      <div class="row">${top.map((x, i) => cardHTML(x, i + 1)).join("")}</div>`;
  }
  const title = {all: "🆕 Yangi qo'shilganlar", pop: "🔥 Ommabop", film: "🎬 Filmlar", ser: "📺 Seriallar", seen: "✓ Ko'rganlarim"}[tab];
  html += `<div class="sec-h"><h2>${title}</h2><span>${list.length} ta</span></div>
    <div class="grid">${list.map((x) => cardHTML(x)).join("")}</div>`;
  m.innerHTML = html;
}

// rasm yuklanganda silliq ko'rinadi; topilmasa — nomli fon
document.addEventListener("load", (e) => { if (e.target.tagName === "IMG") e.target.classList.add("ok"); }, true);
document.addEventListener("error", (e) => {
  const img = e.target;
  if (img.tagName !== "IMG" || !img.parentElement) return;
  if (img.classList.contains("tvl")) { img.remove(); return; }
  const it = byCode.get(+(img.closest("[data-c]")?.dataset.c || cur?.c));
  img.replaceWith(Object.assign(document.createElement("div"), {className: "ph", textContent: it ? it.t : ""}));
}, true);

// ---------- batafsil ----------
let cur = null, busy = false;
function openDetail(it, push = true) {
  cur = it; haptic();
  const big = it.i ? `p/${it.c}_l.webp?v=${it.i}` : "";
  $("hero").innerHTML = (big ? `<div class="blur" style="background-image:url('${big}')"></div>` : "") +
    posterHTML(it, "l");
  // Izohning birinchi qatori kino nomini takrorlasa — olib tashlanadi (sarlavhada bor)
  let desc = (it.d || "").trim();
  const first = desc.split("\n")[0];
  if (first && norm(first) === it._n) desc = desc.slice(first.length).trim();
  const parts = it.p > 1 ? `<div class="ph-h">📺 Qismlar</div><div class="pgrid">${
    Array.from({length: it.p}, (_, i) => `<button class="pbtn${seen[it.c]?.includes(i + 1) ? " seen" : ""}" data-p="${i + 1}">${i + 1}</button>`).join("")}</div>` : "";
  $("info").innerHTML = `<h2>${esc(it.t)}</h2>
    <div class="meta"><span>🔑 Kod: ${it.c}</span>${it.v ? `<span>👁 ${fmt(it.v)}</span>` : ""}${it.p > 1 ? `<span>📺 ${it.p} qism</span>` : ""}</div>
    ${desc ? `<p class="desc${desc.length > 320 ? " cut" : ""}" id="desc">${esc(desc)}</p>${desc.length > 320 ? `<button class="more" id="more">Ko'proq…</button>` : ""}` : ""}
    ${parts}`;
  $("det").scrollTop = 0;
  $("det").classList.add("open");
  const label = it.p > 1 ? `▶️ ${nextPart(it)}-qismni ko'rish` : "▶️ Tomosha qilish";
  $("play").textContent = label;
  if (inTg) {
    tg.BackButton.show();
    tg.MainButton.setParams({text: label, is_visible: true, is_active: true});
  }
  pushed = push;
  if (push) history.pushState({d: it.c}, "");
}
let pushed = false;
function refreshSeen(code) {
  document.querySelectorAll(`.card[data-c="${code}"] .pst`).forEach((p) => {
    if (seen[code] && !p.querySelector(".seen")) p.insertAdjacentHTML("beforeend", `<span class="seen">✓</span>`);
  });
}
function nextPart(it) {
  const s = seen[it.c] || [];
  for (let i = 1; i <= it.p; i++) if (!s.includes(i)) return i;
  return 1;
}
function closeDetail(fromPop = false) {
  if (!cur) return;
  cur = null; hideSheet();
  $("det").classList.remove("open");
  if (inTg) { tg.BackButton.hide(); tg.MainButton.hide(); }
  if (!fromPop && pushed) history.back();
  pushed = false;
  if (tab === "seen") render();
}

// ---------- tomosha qilish ----------
function toast(t, ms = 2200) {
  const el = $("toast"); el.textContent = t; el.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("on"), ms);
}
function setBusy(on, part) {
  busy = on;
  if (inTg) on ? tg.MainButton.showProgress(false) : tg.MainButton.hideProgress();
  $("play").style.opacity = on ? .6 : 1;
  document.querySelectorAll(".pbtn").forEach((b) => b.classList.toggle("busy", on && +b.dataset.p === part));
}
async function watch(it, part, recheck = false) {
  if (busy) return;
  if (!inTg) { toast("📱 Kinoni olish uchun katalogni Telegram ichida oching"); return; }
  setBusy(true, part);
  let r;
  try {
    const res = await fetch("api/watch", {method: "POST",
      headers: {"Content-Type": "application/json", "X-Init-Data": tg.initData},
      body: JSON.stringify({code: it.c, part, recheck})});
    r = await res.json();
  } catch (e) { r = {ok: false, error: "network"}; }
  setBusy(false);
  if (r.ok) {
    haptic("ok"); markSeen(it.c, part); refreshSeen(it.c);
    if (it.p > 1) {
      document.querySelector(`.pbtn[data-p="${part}"]`)?.classList.add("seen");
      const label = `▶️ ${nextPart(it)}-qismni ko'rish`;
      $("play").textContent = label; tg.MainButton.setText(label);
      toast(`✅ ${part}-qism chatga yuborildi`);
    } else {
      toast("✅ Kino chatga yuborildi");
      setTimeout(() => tg.close(), 650);
    }
    return;
  }
  haptic("err");
  const msg = {
    not_found: "❌ Bu kino olib tashlangan",
    rate: `⏳ Juda ko'p so'rov. ${Math.ceil((r.retry || 600) / 60)} daqiqadan keyin urinib ko'ring`,
    auth: "⚠️ Sessiya eskirgan — katalogni yopib, qayta oching",
    network: "📶 Internet bilan muammo. Qayta urinib ko'ring",
    send_failed: "⚠️ Yuborib bo'lmadi. Birozdan keyin urinib ko'ring",
  };
  if (r.error === "need_sub") return showSub(it, part, r.channels || []);
  if (r.error === "need_start") {
    toast("🤖 Botni ishga tushiryapmiz…");
    if (botName) return tg.openTelegramLink(`https://t.me/${botName}?start=kino_${it.c}`);
  }
  toast(msg[r.error] || msg.send_failed, 3200);
}

function showSub(it, part, chans) {
  $("sheet").innerHTML = `<h3>🔒 Bir qadam qoldi</h3><p>Kinoni olish uchun quyidagi kanal(lar)ga a'zo bo'ling, so'ng «Tekshirish» ni bosing.</p>
    ${chans.map((c, i) => `<button class="sbtn" data-u="${i}"><span>📢 ${esc(c.title)}</span><span>A'zo bo'lish ›</span></button>`).join("")}
    <button class="cta" id="recheck">✅ A'zo bo'ldim — tekshirish</button>`;
  $("sheet").querySelectorAll(".sbtn").forEach((b) => b.onclick = () => {
    const u = chans[+b.dataset.u].url;
    /^https:\/\/t\.me\//.test(u) ? tg.openTelegramLink(u) : tg.openLink(u);
  });
  $("recheck").onclick = () => { hideSheet(); watch(it, part, true); };
  $("sbg").classList.add("open"); $("sheet").classList.add("open");
}
function hideSheet() { $("sbg").classList.remove("open"); $("sheet").classList.remove("open"); }
$("sbg").onclick = hideSheet;

// ---------- hodisalar ----------
document.addEventListener("click", (e) => {
  const card = e.target.closest(".card[data-c]");
  if (card) { const it = byCode.get(+card.dataset.c); if (it) openDetail(it); return; }
  const pb = e.target.closest(".pbtn");
  if (pb && cur) { haptic(); watch(cur, +pb.dataset.p); return; }
  if (e.target.id === "more") { $("desc").classList.remove("cut"); e.target.remove(); }
});
$("play").onclick = () => cur && watch(cur, cur.p > 1 ? nextPart(cur) : 1);
$("dclose").onclick = () => closeDetail();
if (inTg) {
  tg.MainButton.onClick(() => cur && watch(cur, cur.p > 1 ? nextPart(cur) : 1));
  tg.BackButton.onClick(() => { if ((window.ZMusic && ZMusic.busy()) || (window.ZDocs && ZDocs.busy()) || (window.ZGames && ZGames.busy())) return; if (!tvCur) closeDetail(); });
}
window.addEventListener("popstate", () => { if (tvCur) closeTV(true); else if (cur) closeDetail(true); });

$("chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  haptic();
  if (mode === "tv") tvCountry = b.dataset.t; else tab = b.dataset.t;
  $("chips").querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c === b));
  renderCur(); window.scrollTo({top: 0});
});
$("chips2").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  haptic(); tvCat = b.dataset.t;
  $("chips2").querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c === b));
  renderTV(); window.scrollTo({top: 0});
});
let qt;
$("q").addEventListener("input", (e) => {
  query = e.target.value.trim();
  $("sbox").classList.toggle("has", !!query);
  clearTimeout(qt); qt = setTimeout(() => { renderCur(); window.scrollTo({top: 0}); }, 120);
});
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.blur(); });
$("clr").onclick = (e) => { e.preventDefault(); $("q").value = ""; query = ""; $("sbox").classList.remove("has"); renderCur(); };
$("chan").onclick = () => { if (!channel) return; inTg ? tg.openTelegramLink(channel) : window.open(channel); };

// =================================================================== 📺 ONLAYN TV
const CAT = {general: "📡 Umumiy", news: "📰 Yangiliklar", sports: "⚽ Sport", kids: "🧸 Bolalar", music: "🎵 Musiqa",
  movies: "🎬 Kino", series: "📺 Seriallar", entertainment: "🎭 Ko'ngilochar", documentary: "🌍 Hujjatli",
  religious: "🕌 Diniy", education: "📚 Ta'lim", culture: "🏛 Madaniyat", family: "👨‍👩‍👧 Oilaviy", comedy: "😂 Komediya",
  animation: "🎞 Multfilm", cooking: "🍳 Taomlar", travel: "✈️ Sayohat", auto: "🚗 Avto", business: "💼 Biznes",
  science: "🔬 Fan", outdoor: "🏕 Tabiat", lifestyle: "✨ Hayot tarzi", legislative: "🏛 Rasmiy", classic: "📼 Klassika",
  relax: "🌿 Dam olish", shop: "🛍 Savdo", weather: "🌦 Ob-havo"};
const FLAG = {uz: "🇺🇿 O'zbek", ru: "🇷🇺 Rus"};
let mode = "kino", tvItems = null, tvById = new Map(), tvCountry = "all", tvCat = "all", tvCur = null, tvList = [];
let tvSoon = false;
let hls = null, hlsLib = null, tvTimer = null, tvTry = 0, tvPushed = false;
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || "null") ?? d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let tvFav = lsGet("zk_tvfav", []), tvRec = lsGet("zk_tvrec", []);

function tvInitials(name) {
  const w = String(name).replace(/[^\p{L}\p{N} ]/gu, "").trim().split(/\s+/);
  const t = (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || "TV").slice(0, 3)).toUpperCase();
  let h = 0; for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return Object.assign(document.createElement("div"), {className: "tvi", textContent: t,
    style: `background:linear-gradient(135deg,hsl(${h} 60% 45%),hsl(${(h + 40) % 360} 60% 30%))`});
}
const logoHTML = (c) => tvInitials(c.n).outerHTML +

const vid = $("vid");
function tvState(s, msg) {
  $("vload").hidden = s !== "load"; $("verr").hidden = s !== "err";
  if (msg) (s === "err" ? $("verrt") : $("vmsg")).textContent = msg;

function stopVideo() {
  clearTimeout(tvTimer);
  const yt = $("yt"); if (!yt.hidden) { yt.src = "about:blank"; yt.hidden = true; } vid.hidden = false;
  if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
  vid.pause(); vid.removeAttribute("src"); try { vid.load(); } catch (e) {}
}
function loadHlsLib() {
  if (hlsLib) return hlsLib;
  hlsLib = new Promise((ok, bad) => {
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js";
    sc.onload = () => ok(window.Hls); sc.onerror = () => { hlsLib = null; bad(new Error("hls")); };
    document.head.appendChild(sc);
  });
  return hlsLib;
}
const nativeHls = () => !!vid.canPlayType("application/vnd.apple.mpegurl") && /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
function report(c, idx, ok, bad = false) {
  if (!inTg) return;
  fetch("api/tv/report", {method: "POST", headers: {"Content-Type": "application/json", "X-Init-Data": tg.initData},
    body: JSON.stringify({id: c.i, i: idx, ok, bad})}).catch(() => {});
}
// YouTube rasmiy jonli efiri → embed manzili (aks holda null)
function ytEmbed(url) {
  let m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|live\/|embed\/)|youtu\.be\/)([\w-]{11})/);
  if (m) return `https://www.youtube.com/embed/${m[1]}`;
  m = url.match(/youtube\.com\/channel\/(UC[\w-]{22})/);
  if (m) return `https://www.youtube.com/embed/live_stream?channel=${m[1]}`;
  return null;
}
function attempt(url) {
  return new Promise(async (ok, bad) => {
    let done = false;
    const cleanup = () => {
      vid.onplaying = vid.onerror = vid.oncanplay = vid.ontimeupdate = null;
    };
    const fin = (f, v) => {
      if (!done) {
        done = true;
        clearTimeout(tvTimer);
        cleanup();
        f(v);
      }
    };
    tvTimer = setTimeout(() => fin(bad, "timeout"), 15000);
    vid.onplaying = () => fin(ok);
    vid.oncanplay = () => {
      if (vid.currentTime > 0 || !vid.paused) fin(ok);
    };
    vid.ontimeupdate = () => {
      if (vid.currentTime > 0) fin(ok);
    };
    vid.onerror = () => fin(bad, "media");

    const tryAutoplay = () => {
      vid.muted = false;
      const p = vid.play();
      if (p && p.catch) {
        p.catch((err) => {
          if (err && err.name === "NotAllowedError") {
            vid.muted = true;
            $("unmute").hidden = false;
            vid.play().catch(() => {});
          }
        });
      }
    };

    try {
      if (nativeHls()) {
        vid.src = url;
        tryAutoplay();
      } else {
        const Hls = await loadHlsLib();
        if (!Hls.isSupported()) {
          vid.src = url;
          tryAutoplay();
        } else {
          hls = new Hls({
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
            enableWorker: true,
            liveSyncDurationCount: 3,
            backBufferLength: 10,
            manifestLoadingMaxRetry: 3,
            levelLoadingMaxRetry: 3,
            fragLoadingMaxRetry: 4
          });
          hls.on(Hls.Events.ERROR, (_, d) => {
            if (d.fatal) {
              if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
                hls.startLoad();
              } else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) {
                hls.recoverMediaError();
              } else {
                fin(bad, d.type);
              }
            }
          });
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            tryAutoplay();
          });
          hls.loadSource(url);
          hls.attachMedia(vid);
        }
      }
    } catch (e) { fin(bad, "load"); }
  });
}
let tvN = 0;
async function playTV(c, from = 0) {
  const my = ++tvTry;
  stopVideo(); tvState("load", "Efirga ulanmoqda…"); $("unmute").hidden = true;
  const streamList = Array.isArray(c.u) ? c.u : [[0, c.stream || c.u]];
  for (let n = from; n < streamList.length; n++) {
    const [idx, url] = streamList[n];
    tvN = n;
    if (n) tvState("load", `Zaxira efir sinalmoqda (${n + 1}/${streamList.length})…`);
    const emb = ytEmbed(url);
    if (emb) {
      vid.hidden = true; const yt = $("yt"); yt.hidden = false;
      yt.src = emb + (emb.includes("?") ? "&" : "?") + "autoplay=1&playsinline=1&rel=0&modestbranding=1";
      tvState("ok"); report(c, idx, true); return;
    }
    try {
      await attempt(url);
      if (my !== tvTry) return;
      tvState("ok"); report(c, idx, true); return;
    } catch (e) {
      if (my !== tvTry) return;
      report(c, idx, false);
      if (hls) { try { hls.destroy(); } catch (x) {} hls = null; }
    }
  }
  if (my === tvTry) { stopVideo(); tvState("err", "Bu kanal hozir efirda emas"); haptic("err"); }
}

  if (push && !tvPushed) { history.pushState({tv: c.i}, ""); tvPushed = true; }
  playTV(c);
