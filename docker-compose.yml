version: '3.8'

services:
  bot:
    build: .
    container_name: zakirovs_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./temp_downloads:/app/temp_downloads
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
